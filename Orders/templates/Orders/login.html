{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in to TrainPOS</title><link rel="stylesheet" href="{% static 'Orders/css/public.css' %}"></head><body class="auth-page"><main class="auth-card"><a class="public-brand" href="{% url 'landing' %}">Train<span>POS</span></a><h1>Welcome back</h1><p>Log in to manage your railway food orders.</p>{% if form.non_field_errors %}<div class="form-errors">{{ form.non_field_errors }}</div>{% endif %}<form method="post">{% csrf_token %}{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<button class="button full" type="submit">Log in</button></form><p class="auth-footer">New to TrainPOS? <a href="{% url 'signup' %}">Start your free trial</a></p></main></body></html>
